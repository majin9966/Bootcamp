on:
  workflow_dispatch:
    inputs:
      templateFilePath:
        description: Path to the Bicep or ARM template file
        required: true
        type: string
      resourceGroupName:
        description: Azure resource group name
        required: true
        type: string
      templateParametersFilePath:
        description: Path to the template parameters file
        required: true
        type: string
      pathToPublish:
        description: Optional path to publish as an artifact
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: "Checkout source code"
      uses: actions/checkout@main

    - name: "Login to Azure"
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: "Lint Bicep File"
      run: |
        az bicep build --file ${{ inputs.templateFilePath }}

    - name: "Validate Templates"
      run: |
        az deployment group validate --resource-group ${{ inputs.resourceGroupName }} --template-file ${{ inputs.templateFilePath }} --parameters ${{ inputs.templateParametersFilePath }}

    - name: "What-If Templates"
      run: |
        az deployment group what-if --resource-group ${{ inputs.resourceGroupName }} --template-file ${{ inputs.templateFilePath }} --parameters ${{ inputs.templateParametersFilePath }}

    - name: "Publish Artifact"
      if: ${{ inputs.pathToPublish != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: infra-templates
        path: ${{ inputs.pathToPublish }}