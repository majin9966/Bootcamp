name: Deploy Bicep Template

on:
  workflow_dispatch:
    inputs:
      templateFilePath:
        description: "Path to the Bicep template file"
        required: false
        default: "infra/main.bicep"
      templateParametersFilePath:
        description: "Path to the Bicep parameters file"
        required: false
        default: "infra/dev.bicepparam"
      resourceGroupName:
        description: "Target resource group"
        required: false
        default: "RG_Donnely.Defoort"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Login to Azure"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Lint bicep files"
        run: |
          az bicep build --file ${{inputs.templateFilePath}}

      - name: "Validate templates"
        run: |
          az deployment group validate --resource-group ${{ inputs.resourceGroupName }} --template-file ${{ inputs.templateFilePath }} --parameters ${{ inputs.templateParametersFilePath }}

      - name: "What-if templates"
        run: |
          az deployment group create --resource-group ${{ inputs.resourceGroupName }} --template-file ${{ inputs.templateFilePath }} --parameters ${{ inputs.templateParametersFilePath }}
 