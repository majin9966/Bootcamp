parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroupName
    type: string
  - name: templateFilePath
    type: string
  - name: templateParametersFilePath
    type: string
 
 
steps:
  - task: AzureCLI@2
    displayName: "Lint Templates"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        az bicep build --file ${{ parameters.templateFilePath }}
 
  - task: AzureCLI@2
    displayName: "Validate Templates"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        az deployment group validate --resource-group ${{ parameters.resourceGroupName }} --template-file ${{ parameters.templateFilePath }} --parameters ${{ parameters.templateParametersFilePath }}
 
  - task: AzureCLI@2
    displayName: "What If Templates"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        az deployment group what-if --resource-group ${{ parameters.resourceGroupName }} --template-file ${{ parameters.templateFilePath }} --parameters ${{ parameters.templateParametersFilePath }}